# Mosquitto MQTT Broker Configuration

listener 1883
protocol mqtt

# WebSocket listener
listener 9001
protocol websockets

# Authentication: password file is generated at container startup
# from MQTT_USERNAME / MQTT_PASSWORD environment variables.
# Set allow_anonymous to false to require credentials.
password_file /mosquitto/data/passwd
allow_anonymous false

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection settings
max_keepalive 60

# Shared subscription support (Mosquitto 2 — enabled by default, listed for clarity)
# Workers subscribe as: $share/ingestion-workers/wlpca/+/data
# Each message is delivered to exactly one worker in the group (round-robin).

# Protect the broker from unbounded queuing if all workers fall behind.
# 10,000 queued messages ≈ ~150 MB at 15 KB/msg; adjust for your RAM budget.
max_queued_messages 10000
