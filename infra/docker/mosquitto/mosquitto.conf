# Mosquitto MQTT Broker Configuration

listener 1883
protocol mqtt

# WebSocket listener
listener 9001
protocol websockets

# Authentication: password file is generated at container startup
# from MQTT_USERNAME / MQTT_PASSWORD environment variables.
# Set allow_anonymous to false to require credentials.
password_file /mosquitto/data/passwd
allow_anonymous false

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection settings
max_keepalive 60
