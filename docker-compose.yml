version: '3.9'

services:
  # ─── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: butterfly-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app123}
      POSTGRES_DB: ${POSTGRES_DB:-current_platform}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-current_platform}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - butterfly-net

  redis:
    image: redis:7-alpine
    container_name: butterfly-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - butterfly-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: butterfly-mosquitto
    env_file:
      - .env
    # Entrypoint generates /tmp/mosquitto.passwd from env vars then starts the broker
    entrypoint: ["/mosquitto/config/docker-entrypoint.sh"]
    volumes:
      - ./infra/docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/docker/mosquitto/docker-entrypoint.sh:/mosquitto/config/docker-entrypoint.sh:ro
    ports:
      - '1883:1883'
      - '9001:9001'
    restart: unless-stopped
    networks:
      - butterfly-net

  # ─── Application Services ─────────────────────────────────────────────────────

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: butterfly-backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app123}@postgres:5432/${POSTGRES_DB:-current_platform}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      EXPORT_DIR: /app/exports
    volumes:
      - ./data/exports:/app/exports
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - butterfly-net

  ingestion-worker:
    build:
      context: .
      dockerfile: apps/ingestion-worker/Dockerfile
    # No container_name here: allows horizontal scaling via
    #   docker compose up --scale ingestion-worker=3
    # Each replica joins the $share/ingestion-workers/... group so every
    # message is processed by exactly one worker (no duplicates).
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app123}@postgres:5432/${POSTGRES_DB:-current_platform}
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_TOPIC: wlpca/+/data
      MQTT_CLIENT_ID: current-platform-ingestion-worker
      MQTT_SHARED_GROUP: ingestion-workers
      INGESTION_CONCURRENCY: ${INGESTION_CONCURRENCY:-10}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped
    networks:
      - butterfly-net

  export-worker:
    build:
      context: .
      dockerfile: apps/export-worker/Dockerfile
    container_name: butterfly-export-worker
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app123}@postgres:5432/${POSTGRES_DB:-current_platform}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      EXPORT_DIR: /app/exports
    volumes:
      - ./data/exports:/app/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - butterfly-net

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: butterfly-frontend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - butterfly-net

networks:
  butterfly-net:
    driver: bridge
